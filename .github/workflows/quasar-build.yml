name: Quasar PWA build
on:
  push:
    branches: [feat/quasar-cli-migration]
  pull_request:
    paths:
      - '**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install and update lockfile
        run: npm install --no-audit --no-fund
      - name: Build Quasar PWA
        run: npm run build
      - name: Commit regenerated npm lockfile on feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile for Quasar"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
