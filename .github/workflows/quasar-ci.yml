name: Quasar SPA build

on:
  push:
    branches: [feat/quasar-clean-init]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test mobile runtime
        run: npm run test:mobile
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check generated app icons
        run: npm run icons:verify
      - name: Build Quasar SPA
        run: npm run build
